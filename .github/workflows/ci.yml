name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beebop
          POSTGRES_PASSWORD: beebop
          POSTGRES_DB: beebop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beebop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://beebop:beebop@localhost:5432/beebop_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-not-a-real-secret
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      # Temporary publish-prep relaxation: keep static-analysis signal visible,
      # but do not block deployment until the existing backend backlog is cleaned up.
      - name: Ruff lint (non-blocking)
        continue-on-error: true
        run: ruff check .
      - name: Black format check (non-blocking)
        continue-on-error: true
        run: black --check .
      - name: Mypy type check (non-blocking)
        continue-on-error: true
        run: mypy app
      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.beebop.store

  inspector:
    name: Inspector PWA — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inspector
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: inspector/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.beebop.store
