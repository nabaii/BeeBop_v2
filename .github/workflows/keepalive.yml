name: Keepalive

# Secondary ping for the Render free tier. UptimeRobot is the primary
# (5-minute interval); this is the in-repo backup per dev plan §3.6.
# Disable this workflow once Render is upgraded to the paid plan at
# Phase 3 beta opening.

on:
  schedule:
    - cron: '*/14 * * * *'  # every 14 minutes — under Render's 15-min idle threshold
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the /health endpoint
        run: |
          set -e
          URL="${{ secrets.BACKEND_URL }}/health"
          echo "Pinging $URL"
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" "$URL")
          cat /tmp/body.txt
          echo ""
          if [ "$status" != "200" ]; then
            echo "Health check failed with HTTP $status"
            exit 1
          fi
