name: Deploy — Staging

# Auto-deploys develop branch pushes to the Render staging service via webhook.
# Vercel deploys the frontend automatically from the same branch — no step
# needed here for frontend.

on:
  push:
    branches: [develop]

jobs:
  trigger-render:
    name: Trigger Render staging deploy
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Poke Render deploy hook
        if: ${{ env.RENDER_STAGING_DEPLOY_HOOK != '' }}
        env:
          RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$RENDER_STAGING_DEPLOY_HOOK"
