services:
  - type: web
    name: beebop-backend
    runtime: python
    rootDir: backend
    buildCommand: bash scripts/render-build.sh
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
