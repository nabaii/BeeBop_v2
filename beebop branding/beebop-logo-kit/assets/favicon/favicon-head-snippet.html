<!-- Beebop favicon + app icon set. Place files in /static (or adjust paths). -->

<!-- Modern browsers: scalable SVG favicon (full triad) -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<!-- Fallback ICO (contains 16px single-cell, 32px + 48px triad) -->
<link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">

<!-- PNG favicons for browsers that prefer them -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">

<!-- Apple touch icon (iOS home screen) -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- PWA / Android -->
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#F0980F">
